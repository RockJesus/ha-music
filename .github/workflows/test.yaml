name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: card-src/package-lock.json
      - name: Install
        working-directory: card-src
        run: npm ci
      - name: Test
        working-directory: card-src
        run: npm test
