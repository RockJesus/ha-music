<!doctype html><html><head><meta charset="utf-8"><style>
:root{--pink:#ff3fd8;--cyan:#3fe8ff;--purple:#8b5cff}
*{box-sizing:border-box}
body{margin:0;background:#050409;font-family:"Segoe UI",Inter,system-ui,sans-serif;color:#fff}
.wrap{display:flex;gap:26px;padding:26px;flex-wrap:wrap}
.card{position:relative;width:560px;height:520px;border-radius:34px;overflow:hidden;border:1px solid rgba(255,255,255,.10);
 box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.10)}
.card.metal{background:radial-gradient(120% 90% at 80% 0%,rgba(190,198,220,.16),transparent 55%),radial-gradient(90% 80% at 10% 100%,rgba(255,63,216,.12),transparent 60%),linear-gradient(150deg,#191b24,#0d0e13 55%,#07070b)}
.card.glass{background:radial-gradient(120% 90% at 75% 0%,rgba(139,92,255,.30),transparent 55%),radial-gradient(100% 80% at 8% 100%,rgba(63,232,255,.18),transparent 60%),linear-gradient(150deg,#21143a,#120d24 50%,#08060f)}
.card.vinyl{background:radial-gradient(110% 90% at 85% 0%,rgba(255,176,92,.14),transparent 55%),radial-gradient(90% 80% at 5% 100%,rgba(255,63,216,.08),transparent 60%),linear-gradient(145deg,#1b1511,#0c0907 60%,#060505)}
.card.holo{background:radial-gradient(110% 90% at 78% 0%,rgba(120,190,255,.18),transparent 55%),radial-gradient(90% 80% at 10% 100%,rgba(255,140,220,.14),transparent 60%),linear-gradient(150deg,#101426,#0a0c17 60%,#05060b)}
.card.carbon{background:radial-gradient(110% 90% at 80% 0%,rgba(63,232,255,.16),transparent 55%),radial-gradient(90% 80% at 10% 100%,rgba(80,255,190,.10),transparent 60%),linear-gradient(150deg,#101b1d,#0a1114 60%,#05080a)}
.card:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.45;
 background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:56px 56px}
.head{position:absolute;top:26px;left:34px;display:flex;align-items:center;gap:10px;font-size:15px;letter-spacing:.12em;color:#e8e1f2}
.dot{width:9px;height:9px;border-radius:50%;background:var(--pink);box-shadow:0 0 14px var(--pink)}
.title{position:absolute;left:320px;top:184px}
.title .now{font-size:14px;letter-spacing:.16em;color:var(--pink);font-weight:700}
.title h1{margin:10px 0 8px;font-size:42px;line-height:1.02;letter-spacing:-.02em}
.title .artist{font-size:19px;color:#a99bbd}
.cover{position:absolute;left:70px;top:156px;width:200px;height:200px;border-radius:50%;
 background:radial-gradient(circle at 35% 30%,#3c3150,#171220 70%),conic-gradient(from 210deg,#f43fa8,#6d3cff,#20c9ff,#f43fa8);
 box-shadow:0 0 60px rgba(255,63,216,.18),inset 0 0 0 10px rgba(0,0,0,.35);z-index:2}
.cover:after{content:"EV";position:absolute;inset:0;display:grid;place-items:center;font-size:38px;font-weight:800;color:#fff;text-shadow:0 4px 24px rgba(255,255,255,.35)}
.badge{position:absolute;top:26px;right:30px;font-size:11px;letter-spacing:.1em;padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.16);color:#e6dcf5;background:rgba(15,12,22,.55)}
.times{display:flex;justify-content:space-between;font-size:11px;color:#b9b2c8;font-variant-numeric:tabular-nums;margin-top:10px}
/* shared bottom layout: bars 368-432, rail 448-466, times 474 */
.bars{position:absolute;left:40px;right:40px;top:366px;height:66px;display:flex;align-items:flex-end;gap:3px}
.times{position:absolute;left:40px;right:40px;top:474px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.06em;color:#b9b2c8;font-variant-numeric:tabular-nums}
/* 1 liquid metal */
.metal .bar{flex:1;border-radius:2px 2px 0 0;background:linear-gradient(180deg,#fbfcff,#c9ccd6 34%,#7c808d 68%,#2c2f38);box-shadow:0 0 8px rgba(225,232,255,.22)}
.metal .bar[data-past="0"]{background:linear-gradient(180deg,#454956,#262931 60%,#14151a);box-shadow:none;opacity:.65}
.metal-rail{position:absolute;left:40px;right:40px;top:444px;height:18px;border-radius:99px;overflow:hidden;
 background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,transparent 1px 3px),
  linear-gradient(180deg,#565a66 0%,#282b33 40%,#0d0e13 100%);
 border:1px solid #767a89;box-shadow:inset 0 1px 3px rgba(255,255,255,.38),inset 0 -2px 6px rgba(0,0,0,.9),0 10px 24px rgba(0,0,0,.55)}
.metal-fill{position:absolute;left:0;top:0;bottom:0;width:42%;border-radius:99px;
 background:linear-gradient(180deg,#ffffff 0%,#eef0f6 16%,#c3c7d4 44%,#9296a6 56%,#dfe2ec 74%,#ffffff 100%);
 box-shadow:inset 0 -3px 7px rgba(0,0,0,.32),0 0 18px rgba(210,224,255,.28)}
.metal-fill:after{content:"";position:absolute;inset:0;border-radius:99px;
 background:linear-gradient(112deg,transparent 18%,rgba(255,63,216,.32) 40%,rgba(63,232,255,.38) 56%,transparent 76%);
 mix-blend-mode:overlay;opacity:.95}
.metal-knob{position:absolute;left:42%;top:50%;width:24px;height:24px;border-radius:50%;transform:translate(-50%,-50%);
 background:radial-gradient(circle at 33% 26%,#ffffff 0 8%,#f0f2f8 20%,#bfc3d0 46%,#7f8393 62%,#383b46 86%);
 box-shadow:0 4px 12px rgba(0,0,0,.7),inset 0 -2px 4px rgba(0,0,0,.35),0 0 18px rgba(220,230,255,.4);z-index:2}
/* 2 glass */
.glass-bars{position:absolute;left:40px;right:40px;top:358px;height:82px;display:flex;align-items:flex-end;gap:3px;
 -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
 mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.glass-bar{flex:1;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,rgba(226,242,255,.95),rgba(150,110,255,.55) 52%,rgba(63,232,255,.42));
 filter:blur(.5px);box-shadow:0 0 14px rgba(139,92,255,.22)}
.glass-bar[data-past="0"]{background:linear-gradient(180deg,rgba(150,170,200,.22),rgba(70,62,98,.12));box-shadow:none}
.glass-tube:after{content:"";position:absolute;left:8px;right:8px;top:3px;height:5px;border-radius:99px;
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.55) 18%,rgba(255,255,255,.18) 55%,transparent);pointer-events:none}
.glass-tube{position:absolute;left:40px;right:40px;top:442px;height:22px;border-radius:999px;
 border:1px solid rgba(255,255,255,.34);
 background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.055));
 -webkit-backdrop-filter:blur(22px) saturate(1.9);backdrop-filter:blur(22px) saturate(1.9);
 box-shadow:inset 0 1px 1px rgba(255,255,255,.55),inset 0 -3px 7px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.45)}
.glass-fill{position:absolute;left:2px;top:2px;bottom:2px;width:calc(42% - 2px);border-radius:999px;
 background:linear-gradient(90deg,rgba(255,90,216,.92),rgba(154,107,255,.86) 38%,rgba(69,232,255,.88) 100%);
 box-shadow:0 0 20px rgba(139,92,255,.5),inset 0 1px 2px rgba(255,255,255,.6);filter:blur(.25px)}
.glass-knob{position:absolute;left:42%;top:50%;width:26px;height:26px;border-radius:50%;transform:translate(-50%,-50%);
 background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.96),rgba(255,255,255,.42) 26%,rgba(170,200,255,.5) 58%,rgba(255,255,255,.18));
 border:1px solid rgba(255,255,255,.6);box-shadow:0 0 22px rgba(120,200,255,.4),inset 0 0 8px rgba(255,255,255,.65);
 -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:2}
/* 3 vinyl */
.vgroove{position:absolute;left:170px;top:256px;width:0;height:0;z-index:1}
.vdisc{position:absolute;left:-124px;top:-124px;width:248px;height:248px;border-radius:50%;
 background:repeating-radial-gradient(circle at 50% 50%,#0b0b0d 0 2px,#242428 2px 3px,#0a0a0c 3px 6px);
 box-shadow:inset 0 0 30px rgba(0,0,0,.9),0 0 46px rgba(255,180,90,.12)}
.vtick{position:absolute;left:0;top:0;width:2px;border-radius:1px;transform-origin:50% 0;
 background:linear-gradient(180deg,#ffe3b6,#c08a4d);box-shadow:0 0 7px rgba(255,180,90,.55)}
.vtick[data-past="0"]{background:linear-gradient(180deg,#3d3328,#1d1813);box-shadow:none}
.varc{position:absolute;left:0;top:0;transform:translate(-50%,-50%);pointer-events:none}
.vsleeve{position:absolute;left:70px;right:70px;bottom:26px;text-align:center;font-size:9px;letter-spacing:.24em;color:rgba(255,214,160,.34)}
.vsleeve:before,.vsleeve:after{content:"";position:absolute;top:50%;width:56px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,200,130,.3))}
.vsleeve:before{left:-14px}.vsleeve:after{right:-14px;transform:scaleX(-1)}
.vread{position:absolute;left:70px;top:398px;width:200px;text-align:center;font-size:10px;letter-spacing:.1em;
 color:#ffd9a6;background:rgba(11,8,5,.66);border:1px solid rgba(255,190,110,.24);border-radius:5px;padding:3px 0;z-index:3;
 box-shadow:inset 0 0 10px rgba(255,170,70,.10)}
/* 4 carbon */
.carbon .bar{flex:1;border-radius:1px;background:linear-gradient(180deg,rgba(214,255,247,.9),rgba(63,232,255,.48) 45%,rgba(36,110,128,.22));box-shadow:0 0 9px rgba(63,232,255,.22)}
.carbon .bar[data-past="0"]{background:linear-gradient(180deg,#26363c,#131c1f 70%);box-shadow:none;opacity:.6}
.carbon-rail{position:absolute;left:40px;right:40px;top:446px;height:16px;border-radius:6px;overflow:hidden;
 background:
  repeating-linear-gradient(45deg,rgba(255,255,255,.055) 0 2px,transparent 2px 6px),
  repeating-linear-gradient(-45deg,rgba(0,0,0,.5) 0 2px,transparent 2px 6px),
  linear-gradient(180deg,#22292d,#0a0d0f);
 border:1px solid rgba(130,160,170,.35);box-shadow:inset 0 1px 2px rgba(255,255,255,.14),0 8px 20px rgba(0,0,0,.5)}
.carbon-fill{position:absolute;left:0;top:0;bottom:0;width:42%;
 background:linear-gradient(90deg,rgba(63,232,255,.95),rgba(90,255,200,.85) 70%,rgba(160,255,225,.95));
 box-shadow:0 0 18px rgba(63,232,255,.6),inset 0 0 9px rgba(255,255,255,.3)}
.carbon-fill:after{content:"";position:absolute;inset:0;
 background:repeating-linear-gradient(115deg,rgba(255,255,255,.22) 0 1px,transparent 1px 4px)}
.carbon-knob{position:absolute;left:42%;top:50%;width:22px;height:22px;border-radius:6px;transform:translate(-50%,-50%);
 background:linear-gradient(145deg,#f2f6f8,#96a4aa 40%,#3f484c 72%,#ccd6da);
 box-shadow:0 3px 10px rgba(0,0,0,.65),inset 0 1px 2px rgba(255,255,255,.5),0 0 14px rgba(63,232,255,.28);z-index:2}

/* 5 holo prism */
.holo .bar{flex:1;border-radius:2px 2px 0 0;background:linear-gradient(180deg,#ffd7f2,#ffd9a8 28%,#b6ffe0 52%,#8fd4ff 72%,#c3a8ff);box-shadow:0 0 10px rgba(180,200,255,.28);filter:saturate(1.15)}
.holo .bar[data-past="0"]{background:linear-gradient(180deg,#394055,#222736 60%,#151925);box-shadow:none;opacity:.6;filter:none}
.holo-rail{position:absolute;left:40px;right:40px;top:446px;height:14px;border-radius:4px;overflow:hidden;
 background:linear-gradient(180deg,#5b6172,#22262f 52%,#101218);
 border:1px solid rgba(190,205,235,.35);box-shadow:inset 0 1px 2px rgba(255,255,255,.35),0 7px 18px rgba(0,0,0,.55)}
.holo-fill{position:absolute;left:0;top:0;bottom:0;width:42%;
 background:linear-gradient(90deg,#ff7ad4,#ffc46b 22%,#8dffcf 45%,#6ec8ff 68%,#b18cff 100%);
 box-shadow:0 0 18px rgba(150,190,255,.75),inset 0 1px 2px rgba(255,255,255,.65)}
.holo-fill:after{content:"";position:absolute;inset:0;
 background:repeating-linear-gradient(112deg,rgba(255,255,255,.35) 0 1px,transparent 1px 5px);mix-blend-mode:overlay}
.holo-knob{position:absolute;left:42%;top:50%;width:20px;height:22px;transform:translate(-50%,-50%);z-index:2;
 clip-path:polygon(50% 0,100% 100%,0 100%);
 background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(190,230,255,.85) 35%,rgba(255,180,230,.85) 62%,rgba(140,255,215,.9));
 box-shadow:0 4px 12px rgba(0,0,0,.7),0 0 18px rgba(170,220,255,.55);filter:drop-shadow(0 0 6px rgba(200,220,255,.4))}
.holo-glow{position:absolute;left:40px;top:438px;width:42%;height:30px;pointer-events:none;
 background:linear-gradient(90deg,rgba(255,90,210,.32),rgba(120,220,255,.30) 55%,rgba(180,140,255,.28));
 filter:blur(10px)}
</style></head><body><div class="wrap" id="wrap"></div>
<script>
function ringTicks(n,cls){let s='';const past=Math.round(n*0.42);for(let i=0;i<n;i++){const h=8+Math.abs(Math.sin(i*0.7+1))*14;s+=`<span class="${cls}" data-past="${i<past?1:0}" style="height:${h}px;transform:translateX(-50%) rotate(${(i/n)*360}deg) translateY(-118px)"></span>`;}return s;}
function rail(n,cls){let s='';for(let i=0;i<n;i++){const h=8+Math.abs(Math.sin(i*0.6+1.1))*58;s+=`<span class="${cls}" data-past="${i<Math.round(n*0.42)?1:0}" style="height:${h}px"></span>`;}return s;}
function head(label){return `<div class="head"><span class="dot" style="background:#ff9bd8;box-shadow:0 0 14px #ff9bd8"></span><b>MAPC</b><span style="opacity:.7">· 正在播放</span></div><div class="badge">${label}</div>`}
function base(cls){return `<div class="cover"><span style="position:absolute;left:0;right:0;bottom:48px;text-align:center;font-size:9px;letter-spacing:.2em;color:rgba(255,255,255,.5)">COLDPLAY</span></div><div class="title"><div class="now">正在播放</div><h1>Everglow</h1><div class="artist">Coldplay</div></div>`}
document.getElementById('wrap').innerHTML=`
<div class="card metal">${head('01 · 液态金属')}${base()}
 <div class="bars">${rail(66,'bar')}</div>
 <div class="metal-rail"><div class="metal-fill"></div><div class="metal-knob"></div></div>
 <div class="times"><span>1:52</span><span>4:31</span></div>
</div>
<div class="card glass">${head('02 · 磨砂玻璃极光')}${base()}
 <div class="glass-bars">${rail(66,'glass-bar')}</div>
 <div class="glass-tube"><div class="glass-fill"></div><div class="glass-knob"></div></div>
 <div class="times"><span>1:52</span><span>4:31</span></div>
</div>
<div class="card vinyl">${head('03 · 黑胶沟槽激光')}
 <div class="vgroove"><div class="vdisc"></div><div class="vticks">${ringTicks(80,'vtick')}</div>
 <svg class="varc" width="238" height="238" viewBox="0 0 238 238"><circle cx="119" cy="119" r="116" fill="none" stroke="rgba(255,190,120,.16)" stroke-width="2"/><circle cx="119" cy="119" r="116" fill="none" stroke="#ffca86" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="${2*Math.PI*116*0.42} ${2*Math.PI*116}" transform="rotate(-90 119 119)" style="filter:drop-shadow(0 0 7px #ffb15e)"/></svg></div>
 ${base()}<div class="vread">1:52 · 4:31 · 拖动外圈</div><div class="vsleeve">SIDE A · 33⅓ RPM · MASTERED</div>
</div>
<div class="card carbon">${head('04 · 碳纤维光织')}${base()}
 <div class="bars">${rail(66,'bar')}</div>
 <div class="carbon-rail"><div class="carbon-fill"></div><div class="carbon-knob"></div></div>
 <div class="times"><span>1:52</span><span>4:31</span></div>
</div>
<div class="card holo">${head('05 · 全息棱镜')}${base()}
 <div class="bars">${rail(66,'bar')}</div><div class="holo-glow"></div>
 <div class="holo-rail"><div class="holo-fill"></div><div class="holo-knob"></div></div>
 <div class="times"><span>1:52</span><span>4:31</span></div>
</div>`;
</script></body></html>
